name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # With CI=true, ray lint also requires a package-lock.json (a Raycast Store rule).
      # This repo uses pnpm, so lint exactly as it runs locally.
      - name: Lint
        run: pnpm lint
        env:
          CI: false

      # The dist environment also runs tsc, the default dev build only bundles.
      - name: Build
        run: pnpm build -e dist -o dist
