<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Polish: select text, press a hotkey, the fixed text is pasted back in place">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112b"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glow2)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Mark -->
    <g transform="translate(88 118)">
      <rect width="72" height="72" rx="18" fill="url(#mark)"/>
      <rect x="16" y="22" width="40" height="5" rx="2.5" fill="#eef2ff"/>
      <rect x="16" y="34" width="30" height="5" rx="2.5" fill="#eef2ff"/>
      <rect x="16" y="46" width="16" height="5" rx="2.5" fill="#eef2ff"/>
      <path d="M38 50 l7 7 l13 -16" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="84" y="290" font-size="104" font-weight="800" letter-spacing="-4" fill="url(#title)">Polish</text>
    <text x="88" y="346" font-size="30" font-weight="500" fill="#c7d2fe" fill-opacity="0.9">Fix the text you selected.</text>
    <text x="88" y="386" font-size="30" font-weight="500" fill="#c7d2fe" fill-opacity="0.9">Paste it back in place.</text>

    <!-- Pills -->
    <g font-size="17" font-weight="600" fill="#e0e7ff">
      <g transform="translate(88 432)">
        <rect width="146" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="73" y="25" text-anchor="middle">Any provider</text>
      </g>
      <g transform="translate(246 432)">
        <rect width="140" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="70" y="25" text-anchor="middle">Instant fix</text>
      </g>
      <g transform="translate(398 432)">
        <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="85" y="25" text-anchor="middle">Human writing</text>
      </g>
    </g>

    <!-- Card -->
    <g transform="translate(680 96)" filter="url(#shadow)">
      <rect width="512" height="368" rx="20" fill="#1c1a33" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="30" cy="30" r="7" fill="#ff5f57"/>
      <circle cx="54" cy="30" r="7" fill="#febc2e"/>
      <circle cx="78" cy="30" r="7" fill="#28c840"/>
      <text x="256" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#a5b4fc" fill-opacity="0.7">Fix Writing</text>
      <line x1="0" y1="60" x2="512" y2="60" stroke="#ffffff" stroke-opacity="0.08"/>

      <text x="32" y="102" font-size="13" font-weight="700" letter-spacing="1.5" fill="#fca5a5" fill-opacity="0.85">BEFORE</text>
      <text x="32" y="140" font-size="25" font-weight="500" fill="#ffffff" fill-opacity="0.55">hey ih heise leo,</text>
      <text x="32" y="174" font-size="25" font-weight="500" fill="#ffffff" fill-opacity="0.55">kurze frage: hast du zeit?</text>

      <g transform="translate(232 196)">
        <circle cx="24" cy="18" r="18" fill="#4f46e5"/>
        <path d="M24 9 v18 M16 20 l8 8 l8 -8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <text x="32" y="262" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6ee7b7">AFTER</text>
      <text x="32" y="300" font-size="25" font-weight="600" fill="#ffffff">Hey, ich heisse Leo.</text>
      <text x="32" y="334" font-size="25" font-weight="600" fill="#ffffff">Hast du Zeit?</text>

      <g transform="translate(372 314)">
        <rect width="112" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="56" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#e0e7ff">Enter  &#8629;</text>
      </g>
    </g>
  </g>
</svg>
